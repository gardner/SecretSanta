<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secret Santa Party Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Mountains+of+Christmas&display=swap");

      .christmas-font {
        font-family: "Mountains of Christmas", cursive;
      }

      .snow {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
      }

      .snowflake {
        position: absolute;
        top: -10px;
        color: white;
        user-select: none;
        animation: fall linear infinite;
      }

      @keyframes fall {
        to {
          transform: translateY(100vh) rotate(360deg);
        }
      }

      .content {
        position: relative;
        z-index: 2;
      }

      body {
        background: linear-gradient(
          135deg,
          #0f4c75 0%,
          #1e3a5f 50%,
          #0f4c75 100%
        );
        min-height: 100vh;
      }

      .christmas-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 3px solid #c41e3a;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .btn-christmas {
        background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
        color: white;
        padding: 12px 24px;
        border: 2px solid #8b0000;
        border-radius: 8px;
        font-weight: bold;
        transition: all 0.3s ease;
      }

      .btn-christmas:hover {
        background: linear-gradient(135deg, #8b0000 0%, #c41e3a 100%);
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(196, 30, 58, 0.3);
      }

      .input-christmas {
        border: 2px solid #c41e3a;
        border-radius: 8px;
        padding: 10px;
        transition: border-color 0.3s ease;
      }

      .input-christmas:focus {
        border-color: #8b0000;
        outline: none;
        box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="snow" id="snow"></div>

    <div class="content min-h-screen flex items-center justify-center p-4">
      <div class="christmas-card rounded-xl p-8 max-w-2xl w-full">
        <div class="text-center mb-8">
          <h1 class="christmas-font text-6xl text-red-700 mb-4">
            Secret Santa
          </h1>
          <p class="text-gray-600 text-lg">
            Create your magical Christmas gift exchange!
          </p>
        </div>

        <form id="partyForm" class="space-y-6">
          <div>
            <label for="partyName" class="block text-gray-700 font-bold mb-2"
              >Party Name</label
            >
            <input
              type="text"
              id="partyName"
              required
              class="input-christmas w-full"
              placeholder="e.g., Office Christmas Party 2024"
            />
          </div>

          <div>
            <label for="budget" class="block text-gray-700 font-bold mb-2"
              >Budget (Optional)</label
            >
            <input
              type="text"
              id="budget"
              class="input-christmas w-full"
              placeholder="e.g., $25 per gift"
            />
          </div>

          <div>
            <label for="criteria" class="block text-gray-700 font-bold mb-2"
              >Additional Criteria (Optional)</label
            >
            <textarea
              id="criteria"
              rows="3"
              class="input-christmas w-full"
              placeholder="e.g., No gift cards, handmade items preferred, etc."
            ></textarea>
          </div>

          <div>
            <label for="guests" class="block text-gray-700 font-bold mb-2">
              Guest Names (one per line, minimum 2 guests)
              <span class="text-sm font-normal text-gray-600"
                >Include yourself if you're participating!</span
              >
            </label>
            <textarea
              id="guests"
              required
              rows="6"
              class="input-christmas w-full"
              placeholder="John Smith&#10;Jane Doe&#10;Bob Wilson&#10;Alice Brown&#10;(Include yourself here if participating)"
            ></textarea>
          </div>

          <button
            id="createParty"
            type="submit"
            class="btn-christmas w-full text-lg"
          >
            🎅 Create Secret Santa Party 🎄
          </button>
        </form>

        <div
          id="result"
          class="hidden mt-8 p-6 bg-green-50 border-2 border-green-300 rounded-lg"
        >
          <h3 class="text-xl font-bold text-green-800 mb-4">
            🎉 Party Created Successfully!
          </h3>
          <p class="text-green-700 mb-4">
            Share the individual guest links below with each person. Each link
            is personal and will show them their Secret Santa assignment!
          </p>
          <div class="space-y-4">
            <div>
              <strong class="text-gray-700">Individual Guest Links:</strong>
              <div id="guestLinks" class="space-y-2">
                <!-- Guest links will be populated here -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/assets/index.js"></script>
  </body>
</html>
