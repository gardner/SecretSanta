services:
  secret-santa:
    build: .
    ports:
      - "${PORT:-8003}:${PORT:-8003}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8003}
      BASE_URL: ${BASE_URL:-}
    restart: unless-stopped
    container_name: secret-santa-app
    volumes:
      - ./data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
